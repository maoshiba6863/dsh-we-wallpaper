name: harness-compat

# harness 适配基线：**只按需运行** —— 触发面只有 workflow_dispatch（不挂 schedule / push），
# 派发一轮「指定版本或 latest 的 harness × 被派发 ref 的 commit」的适配测试；**全绿才入基线**
# （.github/harness-baseline.json）——但不是直接推 main：本工作流推一条固定分支
# `ci/harness-baseline` 并拉起 PR，由维护者在网页端 review 后**手动合并**。
# 失败即红、基线保持上一个全绿对；目标对已被基线覆盖时整轮秒过。
# 派发：gh workflow run harness-compat.yml [-f harness_version=<版本>] [-f force=true]
#
# 第三方边界：不跑 verify:bridge（媒体桥下载）与 verify:e2e；verify 链内媒体桥那步带
# --allow-skip，在干净 runner 上显式跳过。真 harness 探活自带 DSH_WE_MEDIA_LEGACY=1，
# 媒体桥 / ffmpeg 全程不被拉起 —— 适配测试只覆盖 harness ↔ 本插件。
on:
  workflow_dispatch:
    inputs:
      harness_version:
        description: '指定 @deepseek-ai/dsh 版本（留空 = latest 通道）'
        required: false
        default: ''
      force:
        description: '即使目标对已入基线也强制重跑'
        type: boolean
        default: false

concurrency:
  group: harness-compat
  cancel-in-progress: false

permissions:
  contents: write        # 推 ci/harness-baseline 分支
  pull-requests: write   # 开 PR / 更新 PR 正文
  issues: write          # 把 PR 指派给维护者（assignee 走 issues 接口）

jobs:
  compat:
    # windows-latest 与 verify.yml 同平台：部分守卫带 win32/POSIX 条件分支，
    # 换平台会改变被断言的那一半；本插件的开发与发布平台也是 Windows。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 默认 GITHUB_TOKEN 就够：main 受保护，但 `ci/harness-baseline` 是普通分支，
      # 推分支、开 PR 都不需要绕过保护 —— 基线进 main 的唯一通道是那个 PR 的人工合并。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 解析目标 harness 版本 + 基线跳过判定
        id: target
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.harness_version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          FORCE=""
          if [ "$INPUT_FORCE" = "true" ]; then FORCE="--force"; fi
          if [ -n "$INPUT_VERSION" ]; then
            TARGET="$INPUT_VERSION"
            # 手动指定版本 = 显式验证意图，一律重跑（基线判定不参与）。
            FORCE="--force"
          else
            # npm 查询失败即红：探测通道坏了就该报错，不许静默用旧版本。
            TARGET="$(npm view @deepseek-ai/dsh dist-tags.latest)"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          node scripts/harness-compat-baseline.mjs check --harness "$TARGET" --sha "${{ github.sha }}" $FORCE

      - name: 安装 pnpm 与目标版本 harness（并断言装到的就是目标版本）
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          npm install -g pnpm
          npm install -g "@deepseek-ai/dsh@$TARGET"
          INSTALLED="$(node -e 'const{execSync}=require("child_process");const root=execSync("npm root -g").toString().trim();process.stdout.write(require(root+"/@deepseek-ai/dsh/package.json").version)')"
          if [ "$INSTALLED" != "$TARGET" ]; then echo "installed=$INSTALLED target=$TARGET"; exit 1; fi

      # 产物出库（v1.4 起）：`lib/client.js` 不再随 checkout 进来，而下面的 link 探活
      # 直接软链本工作区 —— 先现场构建出产物，否则探活会读到一个不存在的 client。
      # （tarball 通道不用这一步：它走 `npm pack`，prepack 自己会构建。）
      - name: build —— 产物出库后必须先现场生成 lib/client.js
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: npm run build

      - name: UI 面清单棘轮 + sidebar 源码活判据（对最新 harness 真源码）
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: node test/compat-harness-surfaces.mjs

      - name: 真 harness 全链路探活（link → 启动 → 路由 / 落盘 / 日志判据）
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: node test/compat-harness-live.mjs

      # P4-17：同上，但**装 `npm pack` 的产物**（而不是软链工作区）。软链不参与依赖解析，
      # 因此 `peerDependencies` 能否在**安装闭包**里解析这一条，只有这条通道看得见 ——
      # 一次用户回执实测过它的代价（`Packages: +1` → `generation peer validation failed:
      # @deepseek-ai/dsh-client-runtime does not resolve from the installation closure`）。
      - name: 真 harness 全链路探活（tarball → 发布产物被真实安装器装进去）
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: node test/compat-harness-live.mjs --channel tarball --fresh

      - name: 逐页 DOM/样式断言（无头浏览器 + CDP；计算样式探针 + 设置分区走查）
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: node test/compat-harness-pages.mjs

      - name: 全套守卫（build + verify + smoke；媒体桥步 --allow-skip 显式跳过）
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: npm run verify:all

      # 全绿后**不直接推 main**（main 受分支保护：必须 PR + required checks）：
      # 推一条固定分支 `ci/harness-baseline` 再拉起 PR，由维护者在网页端 review 后手动合并。
      # 基线是"数据"，值得人看一眼再进主干；这条路径也不依赖任何 deploy key / bypass。
      - name: 全绿入基线 → 推分支并开 PR（不自动合并）
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.target.outputs.target }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEWER: ${{ github.repository_owner }}
        run: |
          set -eu
          BRANCH="ci/harness-baseline"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 基线是"读-改-写"：先对齐远端 main，避免拿着过期 JSON 去 record。
          PUSHED=0
          for attempt in 1 2 3; do
            git fetch origin main --quiet
            git reset --hard origin/main
            git checkout -B "$BRANCH"
            node scripts/harness-compat-baseline.mjs record --harness "$TARGET" --sha "$SHA" \
              --node "$(node -v)" --runner "$RUNNER_OS"
            if [ -z "$(git status --porcelain .github/harness-baseline.json)" ]; then
              echo "基线无变化，不提交、不开 PR"
              exit 0
            fi
            git add .github/harness-baseline.json
            git commit -q -m "ci(baseline): harness $TARGET × ${SHA:0:7} 全绿入基线"
            if git push --force origin "$BRANCH"; then
              echo "基线分支已推送（第 $attempt 次尝试）"
              PUSHED=1
              break
            fi
            echo "分支推送被拒 ⇒ 重取远端后重试"
            sleep 5
          done
          if [ "$PUSHED" != "1" ]; then echo "基线分支推送失败三次"; exit 1; fi

          DIFF="$(git show --format= --patch HEAD -- .github/harness-baseline.json | sed -n '1,120p')"
          BODY="$RUNNER_TEMP/baseline-pr.md"
          {
            echo "## 自动生成的 harness 适配基线更新"
            echo ""
            echo "- 目标 harness：\`$TARGET\`"
            echo "- 验证提交：\`$SHA\`"
            echo "- 运行记录：$RUN_URL"
            echo "- 分支：\`$BRANCH\`（每次全绿都会强推更新；**本 PR 不会自动合并**）"
            echo ""
            echo "### 基线 diff"
            echo ""
            echo '```diff'
            echo "$DIFF"
            echo '```'
            echo ""
            echo "### 合并前确认"
            echo ""
            echo "- [ ] diff 里只多了本轮 harness × commit 这一对"
            echo "- [ ] 上面的运行记录是绿的"
            echo "- [ ] 在网页端点 **Merge**（机器人只开 PR，合并由人做）"
          } > "$BODY"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file "$BODY"
            echo "已更新现有 PR #$EXISTING"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "ci(baseline): harness $TARGET 全绿入基线" \
              --body-file "$BODY" \
              --reviewer "$REVIEWER" --assignee "$REVIEWER"
          fi

      - name: 上传 harness 运行日志与落盘诊断
        if: always() && steps.target.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: harness-compat-logs
          path: |
            .test-cache/compat/harness.log
            .test-cache/compat/home/.dsh-wallpaper-engine/diag/http.jsonl
          if-no-files-found: warn
